services:
  - type: web
    name: devradar-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

      # Origins allowed to call the API.
      - key: CORS_ORIGIN
        sync: false

      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 120
      - key: AI_RATE_LIMIT_MAX
        value: 30

      # PostgreSQL is the source of truth. Wired from the managed database below,
      # so memory survives every restart, redeploy and free-tier sleep.
      - key: DATABASE_URL
        fromDatabase:
          name: devradar-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_AUTO_MIGRATE
        value: true

      # Optional shared cache. Leave unset to use the in-process cache.
      - key: REDIS_URL
        sync: false

      # Gemini. Model ids are configuration — verify against Google's current
      # model list before deploying.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      # Must match the vector(N) column width already in the database.
      - key: EMBEDDING_DIMENSIONS
        value: 768

databases:
  - name: devradar-postgres
    databaseName: devradar
    region: singapore
    plan: free
    # Render's PostgreSQL ships pgvector; the schema enables it with
    # CREATE EXTENSION IF NOT EXISTS vector on first migration.
    postgresMajorVersion: "16"
